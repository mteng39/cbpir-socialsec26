[package]
name = "cbpir-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
num-complex = "0.4"
openfhe = { git = "https://github.com/iasenovets/openfhe-rs", rev = "3e6a46b1377e89e09414cbca7c0c0140c5338397" }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
