[package]
name = "cbpir-fetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
publish = false

[dependencies]
cbpir-bgv = { path = "../bgv-cpir", features = ["openfhe-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
